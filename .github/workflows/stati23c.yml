<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>For Farah · Blooming Regret & Rolling Petals</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ANIMATED DIM GRADIENT BACKGROUND — low depth, slow pulse */
        body {
            min-height: 100vh;
            background: #000000; /* fallback solid black */
            font-family: 'Segoe UI', 'Poppins', 'Inter', system-ui, -apple-system, 'Playfair Display', serif;
            padding: 2rem 1.2rem;
            overflow-x: hidden;
            position: relative;
        }

        /* subtle animated gradient overlay for depth */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 40% 50%, 
                        rgba(25, 10, 30, 0.65) 0%, 
                        rgba(5, 5, 15, 0.85) 50%,
                        #000000 100%);
            background-size: 200% 200%;
            animation: slowDepthShift 18s ease infinite alternate;
            pointer-events: none;
            z-index: -2;
        }

        /* secondary very low-frequency movement for extra depth */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(45deg, 
                        rgba(35, 15, 45, 0.2) 0px, 
                        rgba(35, 15, 45, 0.2) 2px,
                        transparent 2px,
                        transparent 8px);
            pointer-events: none;
            z-index: -1;
            opacity: 0.35;
            mix-blend-mode: overlay;
        }

        @keyframes slowDepthShift {
            0% {
                background-position: 0% 0%;
                background: radial-gradient(circle at 30% 40%, 
                            rgba(30, 12, 40, 0.7) 0%, 
                            rgba(8, 6, 18, 0.9) 60%,
                            #010101 100%);
            }
            50% {
                background-position: 100% 50%;
                background: radial-gradient(circle at 70% 60%, 
                            rgba(45, 20, 55, 0.65) 0%, 
                            rgba(12, 8, 25, 0.88) 65%,
                            #030001 100%);
            }
            100% {
                background-position: 0% 100%;
                background: radial-gradient(circle at 20% 70%, 
                            rgba(20, 8, 30, 0.72) 0%, 
                            rgba(2, 2, 12, 0.92) 55%,
                            #000000 100%);
            }
        }

        /* main container – cozy, centered, poetic */
        .apology-scene {
            width: 100%;
            max-width: 880px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        /* gentle atmospheric header */
        .soft-prelude {
            text-align: center;
            margin-bottom: 2rem;
            opacity: 0.7;
        }
        .soft-prelude p {
            color: #e2b9cc;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 300;
            backdrop-filter: blur(2px);
        }

        /* container for all rows (each apology + flower) */
        .apologies-list {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            width: 100%;
        }

        /* each row: flexible arrangement */
        .apology-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            width: 100%;
            position: relative;
        }

        /* FLOWER SVG (drawn, no emojis) styling + roll animation */
        .flower-svg {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            opacity: 0;
            transform: scale(0) rotate(0deg);
            will-change: transform, opacity;
            filter: drop-shadow(0 0 3px rgba(255, 160, 180, 0.5));
        }

        /* roll-in-place animation (spawn with spin) */
        .flower-svg.flower-reveal {
            animation: rollInPlace 0.7s cubic-bezier(0.34, 1.2, 0.64, 1) forwards;
        }

        @keyframes rollInPlace {
            0% {
                opacity: 0;
                transform: scale(0) rotate(0deg);
            }
            40% {
                opacity: 1;
                transform: scale(1.1) rotate(180deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(360deg);
            }
        }

        /* apology text styling */
        .apology-text {
            position: relative;
            background: transparent;
            text-align: center;
            font-size: clamp(1.25rem, 5vw, 2.2rem);
            font-weight: 450;
            line-height: 1.4;
            color: #fdf6f0;
            letter-spacing: -0.01em;
            text-shadow: 0 0 6px rgba(0,0,0,0.6);
            padding: 0.5rem 1rem;
            border-radius: 48px;
            transition: opacity 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.1), transform 0.6s cubic-bezier(0.2, 0.85, 0.4, 1);
            opacity: 0;
            transform: translateY(28px);
            max-width: 85%;
            width: auto;
            backdrop-filter: blur(1px);
            flex-shrink: 1;
        }

        /* visible text */
        .apology-text.visible {
            opacity: 1;
            transform: translateY(0px);
        }

        /* BLOOMING COLOR ANIMATION behind each text */
        .apology-text::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 180px;
            height: 180px;
            margin-left: -90px;
            margin-top: -90px;
            background: radial-gradient(circle, 
                rgba(255, 120, 160, 0.9) 0%, 
                rgba(255, 70, 110, 0.6) 35%,
                rgba(255, 200, 120, 0.4) 60%,
                transparent 85%);
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            transform: scale(0);
            opacity: 0;
            filter: blur(12px);
            will-change: transform, opacity;
        }

        /* bloom trigger */
        .apology-text.bloom-active::before {
            animation: bloomGlow 0.7s ease-out forwards;
        }

        @keyframes bloomGlow {
            0% {
                transform: scale(0);
                opacity: 0.9;
                filter: blur(10px);
            }
            45% {
                opacity: 0.8;
                filter: blur(6px);
            }
            100% {
                transform: scale(3.4);
                opacity: 0;
                filter: blur(20px);
            }
        }

        /* responsive adjustments */
        @media (max-width: 600px) {
            .apology-row {
                gap: 0.65rem;
            }
            .flower-svg {
                width: 34px;
                height: 34px;
            }
            .apology-text::before {
                width: 130px;
                height: 130px;
                margin-left: -65px;
                margin-top: -65px;
            }
            @keyframes bloomGlow {
                100% {
                    transform: scale(2.8);
                }
            }
            .apology-text {
                font-size: 1.2rem;
                padding: 0.3rem 0.9rem;
                max-width: 90%;
            }
        }

        /* delicate hover effect on visible texts */
        .apology-text.visible:hover {
            text-shadow: 0 0 10px rgba(255, 180, 200, 0.6);
            transition: text-shadow 0.2s ease;
        }

        /* footer poetic note */
        .apology-footnote {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.8rem;
            color: #b2889c;
            letter-spacing: 1px;
            font-weight: 300;
            opacity: 0.7;
            transition: opacity 0.3s;
        }
        .apology-footnote span {
            font-style: italic;
        }

        /* avoid overflow issues */
        .apologies-list, .apology-row {
            overflow: visible;
        }
    </style>
</head>
<body>

<div class="apology-scene">
    <div class="soft-prelude">
        <p>✧ petals of regret, blooming for you ✧</p>
    </div>

    <div id="apologiesContainer" class="apologies-list">
        <!-- rows will be dynamically generated: flower + apology-text -->
    </div>

    <div class="apology-footnote">
        <span>𓇢𓆸 each flower rolls & each word blooms — for Farah 𓇢𓆸</span>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // HEARTFELT APOLOGETIC WORDS — for Farah
    // --------------------------------------------------------------
    const apologiesToFarah = [
        "Im very sorry for what I have done Farah",
        "Please forgive me Farah, please",
        "I dont want to lose you, I love you",
        "Im sorry for hurting you",
        "I cannot live without you im sorry",
        "I'm sorry for the pain I gave you",
        "Please give me another chance",
        "I love you fully with all my heart",
        "You are precious, and I failed to show it. I'm sorry.",
        "I'm sorry for everything I have done",
        "I regret doing what I did, im sorry",
        "I was wrong, please im sorry"
    ];

    const container = document.getElementById('apologiesContainer');
    let apologyRows = []; // store { rowDiv, textDiv, flowerSpan }

    // Create a delicate drawn flower (SVG, no emojis) with petals & warm center
    function createFlowerSVG() {
        const svgNS = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(svgNS, "svg");
        svg.setAttribute("viewBox", "0 0 32 32");
        svg.setAttribute("width", "100%");
        svg.setAttribute("height", "100%");
        
        // outer petals (5-petal daisy style)
        const petalColors = ["#FFB7C5", "#FFA5B2", "#FFC0D0", "#FF9FB0", "#FFB0C2"];
        const angles = [0, 72, 144, 216, 288];
        angles.forEach((angle, idx) => {
            const petal = document.createElementNS(svgNS, "ellipse");
            const rad = angle * Math.PI / 180;
            const cx = 16 + 10 * Math.cos(rad);
            const cy = 16 + 10 * Math.sin(rad);
            petal.setAttribute("cx", cx);
            petal.setAttribute("cy", cy);
            petal.setAttribute("rx", "7");
            petal.setAttribute("ry", "4.5");
            petal.setAttribute("fill", petalColors[idx % petalColors.length]);
            petal.setAttribute("stroke", "#FF8196");
            petal.setAttribute("stroke-width", "0.6");
            svg.appendChild(petal);
        });
        
        // inner smaller petals for fullness
        const innerAngles = [36, 108, 180, 252, 324];
        innerAngles.forEach((angle) => {
            const petal = document.createElementNS(svgNS, "ellipse");
            const rad = angle * Math.PI / 180;
            const cx = 16 + 6.5 * Math.cos(rad);
            const cy = 16 + 6.5 * Math.sin(rad);
            petal.setAttribute("cx", cx);
            petal.setAttribute("cy", cy);
            petal.setAttribute("rx", "5");
            petal.setAttribute("ry", "3.5");
            petal.setAttribute("fill", "#FFCAD4");
            petal.setAttribute("stroke", "#FF9AAD");
            petal.setAttribute("stroke-width", "0.4");
            svg.appendChild(petal);
        });
        
        // center of flower
        const center = document.createElementNS(svgNS, "circle");
        center.setAttribute("cx", "16");
        center.setAttribute("cy", "16");
        center.setAttribute("r", "5");
        center.setAttribute("fill", "#FFD966");
        center.setAttribute("stroke", "#E6B422");
        center.setAttribute("stroke-width", "0.8");
        svg.appendChild(center);
        
        // tiny pollen dots
        const dots = [[14.5,15], [17,16.5], [15.2,18], [13,17], [18,14]];
        dots.forEach(([cx, cy]) => {
            const dot = document.createElementNS(svgNS, "circle");
            dot.setAttribute("cx", cx);
            dot.setAttribute("cy", cy);
            dot.setAttribute("r", "0.8");
            dot.setAttribute("fill", "#B87C2E");
            svg.appendChild(dot);
        });
        
        return svg;
    }

    // Build each row: alternate flower side (left/right) so flowers spawn at sides naturally
    function buildApologyMessages() {
        apologiesToFarah.forEach((message, index) => {
            const row = document.createElement('div');
            row.className = 'apology-row';
            
            const textDiv = document.createElement('div');
            textDiv.className = 'apology-text';
            textDiv.textContent = message;
            
            const flowerSpan = document.createElement('span');
            flowerSpan.className = 'flower-svg';
            const flowerSVG = createFlowerSVG();
            flowerSpan.appendChild(flowerSVG);
            
            // Alternate placement: even index → flower on left, odd → flower on right
            if (index % 2 === 0) {
                row.appendChild(flowerSpan);
                row.appendChild(textDiv);
            } else {
                row.appendChild(textDiv);
                row.appendChild(flowerSpan);
            }
            
            container.appendChild(row);
            apologyRows.push({
                rowDiv: row,
                textDiv: textDiv,
                flowerSpan: flowerSpan
            });
        });
    }
    
    // Trigger text pop-up (with bloom) + flower roll-in-place animation simultaneously
    function bringTextAndFlower(rowItem, rowIndex) {
        const { textDiv, flowerSpan } = rowItem;
        if (!textDiv) return;
        
        // 1. make text visible (pop-up animation)
        textDiv.classList.add('visible');
        
        // 2. trigger blooming color animation behind the text
        textDiv.classList.add('bloom-active');
        
        // remove bloom class after animation ends (clean)
        setTimeout(() => {
            textDiv.classList.remove('bloom-active');
        }, 750);
        
        // 3. flower appears at side with roll-in-place animation
        if (flowerSpan) {
            // reset + force reflow to ensure animation plays freshly
            flowerSpan.classList.remove('flower-reveal');
            void flowerSpan.offsetWidth; // reflow trick
            flowerSpan.classList.add('flower-reveal');
        }
        
        // subtle final touch after last text appears
        if (rowIndex === apologyRows.length - 1) {
            setTimeout(() => {
                const footer = document.querySelector('.apology-footnote');
                if (footer) footer.style.opacity = '0.95';
            }, 500);
        }
    }
    
    // Sequential reveal: slowly pop up each text and flower (approx 1 per second)
    function startSlowRevelation() {
        let cumulativeDelay = 0;
        const intervalTime = 1000; // gentle rhythmic pop
        
        apologyRows.forEach((rowItem, idx) => {
            setTimeout(() => {
                bringTextAndFlower(rowItem, idx);
            }, cumulativeDelay);
            cumulativeDelay += intervalTime;
        });
        
        // optional extra shimmer after all animations
        const totalDuration = cumulativeDelay + 900;
        setTimeout(() => {
            const allFlowers = document.querySelectorAll('.flower-svg');
            allFlowers.forEach(fl => {
                fl.style.filter = "drop-shadow(0 0 5px #ffb7c5)";
                setTimeout(() => {
                    if (fl) fl.style.filter = "";
                }, 500);
            });
        }, totalDuration);
    }
    
    // Initialize everything
    function init() {
        buildApologyMessages();
        // tiny delay to ensure DOM ready and smooth first frame
        setTimeout(() => {
            startSlowRevelation();
        }, 220);
    }
    
    window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
